# Local: docker compose up -d --build  →  http://localhost:8080
# External MySQL: add -f docker-compose.external-db.yml

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
            target: development
        image: truckit-mcp-app:dev
        container_name: truckit-mcp-app
        restart: unless-stopped
        working_dir: /var/www
        # Laravel reads .env from the bind mount (do not load .env via compose env_file).
        environment:
            DOCKER_BOOTSTRAP_DB: ${DOCKER_BOOTSTRAP_DB:-true}
            APP_URL: ${APP_URL:-http://localhost:8080}
            OG_IMAGE_NODE_BINARY: ${OG_IMAGE_NODE_BINARY:-/usr/bin/node}
            OG_IMAGE_CHROME_PATH: ${OG_IMAGE_CHROME_PATH:-/usr/bin/chromium}
            OG_IMAGE_NO_SANDBOX: ${OG_IMAGE_NO_SANDBOX:-true}
        volumes:
            - ./:/var/www
            - ./docker/php/local.ini:/usr/local/etc/php/conf.d/99-local.ini
            - mcp-storage-framework:/var/www/storage/framework
            - mcp-bootstrap-cache:/var/www/bootstrap/cache
        extra_hosts:
            - host.docker.internal:host-gateway
        healthcheck:
            test: ["CMD-SHELL", "php artisan inspire --quiet >/dev/null 2>&1"]
            interval: 15s
            timeout: 10s
            retries: 5
            start_period: 120s
        networks:
            - mcp-network

    webserver:
        image: nginx:alpine
        container_name: truckit-mcp-web
        restart: unless-stopped
        ports:
            - "${APP_PORT:-8080}:80"
        volumes:
            - ./:/var/www
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            app:
                condition: service_healthy
        networks:
            - mcp-network

networks:
    mcp-network:
        driver: bridge

volumes:
    mcp-storage-framework:
    mcp-bootstrap-cache:

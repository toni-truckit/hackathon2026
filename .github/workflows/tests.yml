name: "Lint & Test PR"

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize

permissions:
  pull-requests: read

jobs:
  main:
    name: Pint, Rector & Test with coverage
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        php: [ 8.4, 8.5 ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: "Check PR title"
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Setup PHP"
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, exif, fileinfo, intl, json, libxml, mbstring, pdo_sqlite, sqlite3
          coverage: xdebug

      - name: "Install Composer Dependencies"
        run: |
          composer install --no-interaction --prefer-dist --optimize-autoloader --no-ansi --no-progress

      - name: Prepare Laravel
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: "Run Rector"
        run: |
          php vendor/bin/rector process --dry-run --config=rector.php

      - name: "Run Pint"
        run: |
          php vendor/bin/pint --config=pint.json --test --verbose --dirty

      - name: "Run Tests"
        run: |
          php vendor/bin/pest --colors=always --stop-on-failure --coverage --ci

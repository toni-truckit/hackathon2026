# Local: docker compose up -d --build
# App: http://localhost:8080
# Join business-api MySQL: set BUSINESS_API_NETWORK in .env (see README) and DB_* hosts to db2.

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
            target: development
        image: truckit-mcp-app:dev
        container_name: truckit-mcp-app
        restart: unless-stopped
        working_dir: /var/www
        env_file:
            - .env
        environment:
            APP_URL: ${APP_URL:-http://localhost:8080}
            OG_IMAGE_NODE_BINARY: ${OG_IMAGE_NODE_BINARY:-/usr/bin/node}
            OG_IMAGE_CHROME_PATH: ${OG_IMAGE_CHROME_PATH:-/usr/bin/chromium}
            OG_IMAGE_NO_SANDBOX: ${OG_IMAGE_NO_SANDBOX:-true}
        volumes:
            - ./:/var/www
            - ./docker/php/local.ini:/usr/local/etc/php/conf.d/99-local.ini
        extra_hosts:
            - host.docker.internal:host-gateway
        networks:
            - mcp-network

    webserver:
        image: nginx:alpine
        container_name: truckit-mcp-web
        restart: unless-stopped
        ports:
            - "${APP_PORT:-8080}:80"
        volumes:
            - ./:/var/www
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app
        networks:
            - mcp-network

networks:
    mcp-network:
        driver: bridge
